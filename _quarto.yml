abstract: >+
  Multidimensional methods are essential for the statistical analysis of complex data, 
  such as omics and spectral data. Although many R packages exist, they have different 
  approaches/philosophies. TODO A COMPLETER ICI
  
  The RGCCA and mixOmics packages were considered.  Differences in implementation
  were identified, particularly with regard to deflation and prediction algorithms. 
  The impact on the results becomes visible from the second component of the models.
keywords: [Multidimensional analysis, R package comparison, RGCCA, mixOmics]
